<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>券商竞品宣发监控 · BIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --navy:#03101e; --navy2:#061f3d; --navy3:#0a2547;
    --ink:#eaf2fb; --sub:#9fb2c8; --dim:#5e708a;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.05);
    --blue:#4d8dff; --blue-d:#0048bb; --gold:#c9a86a;
    --good:#34d399; --warn:#fbbf24; --hot:#f87171;
    --glass:rgba(255,255,255,.035);
    --serif:"Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);line-height:1.55;min-height:100vh;
    background:
      radial-gradient(1200px 600px at 12% -5%, rgba(77,141,255,.18), transparent 55%),
      radial-gradient(900px 500px at 95% 8%, rgba(201,168,106,.10), transparent 50%),
      linear-gradient(180deg,#03101e 0%, #061a33 45%, #03101e 100%);
    background-attachment:fixed;
    padding:34px 22px 90px;position:relative;overflow-x:hidden}
  /* tech grid + data streaks */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(120,160,220,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,160,220,.05) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 80%)}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
    background-image:repeating-linear-gradient(115deg,transparent 0 80px,rgba(77,141,255,.06) 80px 81px)}
  .wrap{max-width:1220px;margin:0 auto;position:relative;z-index:1}

  /* header */
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;
    padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:1px;
    color:#fff;padding:2px 12px;border:1.5px solid var(--gold);border-radius:8px;
    box-shadow:0 0 24px rgba(201,168,106,.25)}
  h1{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:.3px;line-height:1.25}
  h1 .sub{display:block;font-family:var(--sans);font-size:12.5px;color:var(--sub);font-weight:400;letter-spacing:.5px;margin-top:4px}
  .live{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--good);
    text-transform:uppercase;letter-spacing:1.5px;margin-left:10px;vertical-align:middle}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right;line-height:1.9}
  .meta b{color:var(--ink);font-weight:500}

  .sec-title{font-family:var(--serif);font-size:17px;font-weight:600;color:#fff;margin:38px 0 14px;
    display:flex;align-items:center;gap:11px;letter-spacing:.4px}
  .sec-title::before{content:"";width:4px;height:18px;background:linear-gradient(var(--gold),var(--blue));border-radius:3px;box-shadow:0 0 12px rgba(77,141,255,.5)}
  .sec-title .en{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:400;text-transform:uppercase;letter-spacing:2px;margin-left:auto}

  /* highlights */
  .hl{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:6px 20px;
    backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .hl ul{list-style:none}
  .hl li{display:flex;gap:13px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line2);font-size:14px;color:#d4e0ee}
  .hl li:last-child{border-bottom:none}
  .tag{font-family:var(--mono);font-size:10px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap;flex-shrink:0;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
  .t-new{background:rgba(248,113,113,.15);color:#fca5a5;border:1px solid rgba(248,113,113,.3)}
  .t-up{background:rgba(251,191,36,.13);color:#fcd34d;border:1px solid rgba(251,191,36,.28)}
  .t-info{background:rgba(77,141,255,.14);color:#93c0ff;border:1px solid rgba(77,141,255,.3)}

  /* competitor grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(372px,1fr));gap:18px}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:20px;
    display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(10px);position:relative;overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .25s,border-color .25s,box-shadow .25s}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(77,141,255,.5),transparent)}
  .card:hover{transform:translateY(-3px);border-color:rgba(77,141,255,.35);box-shadow:0 14px 40px rgba(0,0,0,.4),0 0 0 1px rgba(77,141,255,.15)}
  .card-h{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;font-family:var(--serif);box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .card-h .nm{font-size:17px;font-weight:700;letter-spacing:.3px}
  .card-h .st{font-family:var(--mono);font-size:11px;color:var(--sub);margin-top:2px}
  .status-pill{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:4px 11px;border-radius:20px;letter-spacing:.5px}
  .live-s{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.35)}
  .soon-s{background:rgba(251,191,36,.14);color:#fcd34d;border:1px solid rgba(251,191,36,.32)}
  .watch-s{background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--line)}
  .blk .lbl{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px}
  .blk ul{list-style:none;display:flex;flex-direction:column;gap:6px}
  .blk li{padding-left:16px;position:relative;color:#c3d2e3;font-size:13px}
  .blk li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:1px;background:var(--blue);box-shadow:0 0 6px rgba(77,141,255,.7);transform:rotate(45deg)}
  .x-sig{background:rgba(77,141,255,.06);border:1px solid rgba(77,141,255,.16);border-radius:11px;padding:11px 13px;font-size:12.5px;color:#aebfd4}
  .x-sig .lbl{color:#93c0ff}
  .align{background:linear-gradient(180deg,rgba(201,168,106,.1),rgba(201,168,106,.03));border:1px solid rgba(201,168,106,.28);border-radius:11px;padding:11px 13px;font-size:13px;color:#ecd9b6}
  .align .lbl{color:var(--gold)}
  .pending{color:#5e708a;font-style:italic}

  /* matrix */
  .matrix-wrap{background:var(--glass);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(10px)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line2)}
  th{font-family:var(--mono);background:rgba(255,255,255,.03);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);font-weight:500}
  td:first-child{font-weight:600;color:#d4e0ee}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(77,141,255,.04)}
  .yes{color:var(--good);font-size:15px;text-shadow:0 0 10px rgba(52,211,153,.6)}
  .no{color:#3a4a5e}.qq{color:var(--gold)}
  .legend{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:9px;letter-spacing:.5px}

  /* actions */
  .actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .act{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:16px 18px;backdrop-filter:blur(10px);position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
  .act::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
  .act:hover{transform:translateY(-2px);border-color:rgba(201,168,106,.4)}
  .act h4{font-family:var(--serif);font-size:15px;margin-bottom:7px;color:#fff}
  .act p{font-size:13px;color:var(--sub);line-height:1.6}
  .act .src{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:10px;letter-spacing:.5px}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:center;line-height:2;letter-spacing:.3px}
  a{color:var(--blue);text-decoration:none}
  @media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:21px}}
</style>
</head>
<body>
