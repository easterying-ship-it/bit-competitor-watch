<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>券商竞品宣发监控 · BIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#03101e; --navy2:#061f3d; --navy3:#0a2547;
    --ink:#eaf2fb; --sub:#9fb2c8; --dim:#5e708a;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.05);
    --blue:#4d8dff; --blue-d:#0048bb; --gold:#c9a86a;
    --good:#34d399; --warn:#fbbf24; --hot:#f87171;
    --glass:rgba(255,255,255,.035);
    --serif:"Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);line-height:1.55;min-height:100vh;
    background:
      radial-gradient(1200px 600px at 12% -5%, rgba(77,141,255,.18), transparent 55%),
      radial-gradient(900px 500px at 95% 8%, rgba(201,168,106,.10), transparent 50%),
      linear-gradient(180deg,#03101e 0%, #061a33 45%, #03101e 100%);
    background-attachment:fixed;
    padding:34px 22px 90px;position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(120,160,220,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,160,220,.05) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 80%)}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
    background:radial-gradient(ellipse 900px 400px at 50% 0%, rgba(77,141,255,.07), transparent)}
  .wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto}

  /* ── HEADER ── */
  .hdr{display:flex;align-items:center;justify-content:space-between;
    padding:0 4px 28px;border-bottom:1px solid var(--line);margin-bottom:32px;flex-wrap:wrap;gap:14px}
  .hdr-left{display:flex;align-items:center;gap:18px}
  .logo-box{width:44px;height:44px;border-radius:10px;
    background:linear-gradient(135deg,#0048bb 0%,#4d8dff 100%);
    display:flex;align-items:center;justify-content:center;font-size:22px;
    box-shadow:0 0 18px rgba(77,141,255,.35)}
  .brand{font-family:var(--serif);font-size:1.35rem;font-weight:700;letter-spacing:.04em;
    background:linear-gradient(90deg,#eaf2fb,#9fb2c8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{font-size:.72rem;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
  .hdr-right{display:flex;align-items:center;gap:20px}
  .ts{font-size:.72rem;color:var(--dim);font-family:var(--mono)}
  .ts span{color:var(--sub)}

  /* ── STAT BAR ── */
  .stat-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:32px}
  .stat-card{background:var(--glass);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;backdrop-filter:blur(8px);transition:border-color .2s}
  .stat-card:hover{border-color:rgba(255,255,255,.18)}
  .stat-label{font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .stat-val{font-size:1.7rem;font-weight:700;font-family:var(--mono);color:var(--ink);line-height:1}
  .stat-val.gold{color:var(--gold)}
  .stat-val.blue{color:var(--blue)}
  .stat-val.good{color:var(--good)}
  .stat-val.hot{color:var(--hot)}
  .stat-sub{font-size:.68rem;color:var(--dim);margin-top:6px}

  /* ── FILTER BAR ── */
  .filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .filter-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--line);
    background:transparent;color:var(--sub);font-size:.75rem;cursor:pointer;
    transition:all .18s;font-family:var(--sans)}
  .filter-btn:hover{border-color:var(--blue);color:var(--blue)}
  .filter-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .search-box{margin-left:auto;position:relative}
  .search-box input{background:var(--glass);border:1px solid var(--line);border-radius:20px;
    padding:5px 14px 5px 32px;color:var(--ink);font-size:.75rem;width:200px;
    outline:none;transition:border-color .18s;font-family:var(--sans)}
  .search-box input:focus{border-color:var(--blue)}
  .search-box::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);
    color:var(--dim);font-size:.9rem;pointer-events:none}

  /* ── GRID ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}

  /* ── CARD ── */
  .card{background:var(--glass);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;
    backdrop-filter:blur(10px);display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);border-color:rgba(77,141,255,.3);
    box-shadow:0 8px 32px rgba(0,0,0,.35)}
  .card-head{padding:18px 20px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:flex-start;gap:12px}
  .co-logo{width:38px;height:38px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;
    background:linear-gradient(135deg,var(--navy2),var(--navy3));
    border:1px solid var(--line)}
  .co-info{flex:1;min-width:0}
  .co-name{font-size:.95rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .co-meta{font-size:.68rem;color:var(--dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;
    font-size:.65rem;font-weight:500;letter-spacing:.03em}
  .badge-tier1{background:rgba(201,168,106,.15);color:var(--gold);border:1px solid rgba(201,168,106,.25)}
  .badge-tier2{background:rgba(77,141,255,.12);color:var(--blue);border:1px solid rgba(77,141,255,.2)}
  .badge-tier3{background:rgba(94,112,138,.15);color:var(--sub);border:1px solid rgba(94,112,138,.25)}
  .heat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:6px}
  .heat-5{background:var(--hot);box-shadow:0 0 6px var(--hot)}
  .heat-4{background:var(--warn);box-shadow:0 0 6px var(--warn)}
  .heat-3{background:var(--blue);box-shadow:0 0 5px var(--blue)}
  .heat-2{background:var(--dim)}
  .heat-1{background:var(--line)}

  /* ── CHANNELS ── */
  .channels{padding:14px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
  .ch-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;
    background:rgba(255,255,255,.025);transition:background .15s}
  .ch-row:hover{background:rgba(255,255,255,.05)}
  .ch-icon{font-size:1rem;width:22px;text-align:center;flex-shrink:0}
  .ch-name{font-size:.75rem;color:var(--sub);width:72px;flex-shrink:0}
  .ch-bar-wrap{flex:1;height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
  .ch-bar{height:100%;border-radius:2px;transition:width .4s ease}
  .ch-val{font-size:.72rem;font-family:var(--mono);color:var(--ink);width:28px;text-align:right;flex-shrink:0}
  .ch-tag{font-size:.62rem;padding:1px 6px;border-radius:6px;flex-shrink:0;font-weight:500}
  .tag-hot{background:rgba(248,113,113,.15);color:var(--hot)}
  .tag-up{background:rgba(52,211,153,.15);color:var(--good)}
  .tag-new{background:rgba(77,141,255,.15);color:var(--blue)}
  .tag-flat{background:rgba(94,112,138,.12);color:var(--dim)}
  .tag-none{background:rgba(94,112,138,.08);color:var(--dim);opacity:.6}

  /* ── LATEST POST ── */
  .latest{padding:10px 20px 16px;border-top:1px solid var(--line2)}
  .latest-label{font-size:.63rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .latest-text{font-size:.75rem;color:var(--sub);line-height:1.5;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .latest-text a{color:var(--blue);text-decoration:none}
  .latest-text a:hover{text-decoration:underline}
  .latest-meta{font-size:.65rem;color:var(--dim);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}

  /* ── FOOTER ── */
  .foot{margin-top:48px;padding-top:22px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .foot-note{font-size:.68rem;color:var(--dim)}
  .legend{display:flex;gap:14px;flex-wrap:wrap}
  .leg-item{display:flex;align-items:center;gap:5px;font-size:.67rem;color:var(--dim)}
  .leg-dot{width:8px;height:8px;border-radius:50%}

  /* ── MODAL / DETAIL ── */
  .modal-bg{position:fixed;inset:0;z-index:100;background:rgba(3,16,30,.85);
    backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .25s}
  .modal-bg.open{opacity:1;pointer-events:all}
  .modal{background:linear-gradient(160deg,#0a2040,#061530);
    border:1px solid rgba(255,255,255,.1);border-radius:20px;
    width:min(700px,94vw);max-height:85vh;overflow-y:auto;padding:32px;
    transform:translateY(20px);transition:transform .25s}
  .modal-bg.open .modal{transform:translateY(0)}
  .modal-close{float:right;background:none;border:none;color:var(--dim);font-size:1.3rem;
    cursor:pointer;line-height:1;padding:0 2px}
  .modal-close:hover{color:var(--ink)}
  .modal h2{font-family:var(--serif);font-size:1.25rem;color:var(--ink);margin-bottom:4px}
  .modal-sub{font-size:.75rem;color:var(--dim);margin-bottom:22px}
  .modal-section{margin-bottom:20px}
  .modal-section h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--dim);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .detail-item{background:rgba(255,255,255,.04);border-radius:10px;padding:12px}
  .detail-item .label{font-size:.65rem;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
  .detail-item .val{font-size:.9rem;color:var(--ink);font-family:var(--mono)}
  .detail-item .val.good{color:var(--good)}
  .detail-item .val.hot{color:var(--hot)}
  .detail-item .val.gold{color:var(--gold)}
  .post-list{display:flex;flex-direction:column;gap:8px}
  .post-item{background:rgba(255,255,255,.04);border-radius:10px;padding:12px 14px;
    border-left:3px solid var(--blue)}
  .post-item.viral{border-left-color:var(--hot)}
  .post-title{font-size:.8rem;color:var(--ink);margin-bottom:4px;line-height:1.4}
  .post-title a{color:inherit;text-decoration:none}
  .post-title a:hover{color:var(--blue)}
  .post-stats{font-size:.67rem;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
  .post-stats .hot-stat{color:var(--hot)}

  /* ── TREND SPARK ── */
  .spark-wrap{padding:0 20px 14px}
  .spark-label{font-size:.63rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .spark{display:flex;align-items:flex-end;gap:2px;height:28px}
  .spark-bar{flex:1;border-radius:2px 2px 0 0;min-height:2px;transition:height .3s}

  /* ── SORT / VIEW TOGGLE ── */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .sort-select{background:var(--glass);border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;color:var(--sub);font-size:.75rem;outline:none;cursor:pointer;
    font-family:var(--sans)}
  .sort-select option{background:#061f3d}
  .view-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
  .view-btn{background:transparent;border:none;padding:5px 10px;color:var(--dim);cursor:pointer;font-size:.85rem;transition:all .15s}
  .view-btn.active{background:var(--blue);color:#fff}
  .count-badge{background:rgba(77,141,255,.15);color:var(--blue);font-size:.68rem;
    padding:2px 8px;border-radius:10px;font-family:var(--mono)}

  /* ── LIST VIEW ── */
  .list-view .card{flex-direction:row;align-items:stretch}
  .list-view .card-head{border-bottom:none;border-right:1px solid var(--line2);flex-shrink:0;width:220px;flex-direction:column}
  .list-view .channels{padding:14px 16px;flex-direction:row;flex-wrap:wrap;gap:6px;align-content:flex-start}
  .list-view .ch-row{padding:5px 8px;flex:0 0 auto;width:auto}
  .list-view .ch-bar-wrap{display:none}
  .list-view .spark-wrap,.list-view .latest{display:none}

  @media(max-width:640px){
    .grid{grid-template-columns:1fr}
    .list-view .card{flex-direction:column}
    .list-view .card-head{width:100%;border-right:none;border-bottom:1px solid var(--line2)}
  }
</style>
</head>

<div class="wrap">

<!-- HEADER -->

<!-- TOOLBAR -->
<div class="toolbar">

      <input type="text" id="searchInput" placeholder="搜索券商…">
    </div>
  </div>
  <select class="sort-select" id="sortSelect">
    <option value="heat">按热度排序</option>
    <option value="name">按名称排序</option>
    <option value="posts">按发帖量排序</option>
    <option value="tier">按等级排序</option>
  </select>
  <span class="count-badge" id="countBadge">15 家</span>
  <div class="view-toggle">
    <button class="view-btn active" id="gridViewBtn" title="卡片视图">▦</button>
    <button class="view-btn" id="listViewBtn" title="列表视图">☰</button>
  </div>
</div>

<!-- GRID -->
<div class="grid" id="brokerGrid"></div>

<!-- FOOTER -->
<div class="foot">
  <div class="foot-note">数据每小时更新 · 仅供内部参考 · BIT Research</div>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:var(--hot)"></div>极热</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--warn)"></div>高热</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--blue)"></div>活跃</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--dim)"></div>低频</div>
    <div class="leg-item"><div class="leg-dot" style="background:var(--line)"></div>静默</div>
  </div>
</div>

</div><!-- /wrap -->

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <h2 id="modalTitle"></h2>
    <div class="modal-sub" id="modalSub"></div>
    <div id="modalBody"></div>
  </div>
</div>

/* ═══════════════════════════════════════════════
   RENDER ENGINE
   ═══════════════════════════════════════════════ */
const BAR_COLORS = {
  hot:'#f87171', up:'#4d8dff', flat:'#5e708a', none:'#2d3f55', new:'#34d399'
};

function heatClass(h){return['','heat-1','heat-2','heat-3','heat-4','heat-5'][h]||'heat-1'}

function tierLabel(t){return{tier1:'头部一线',tier2:'腰部二线',tier3:'区域三线'}[t]||t}
function tierBadge(t){return`<span class="badge badge-${t}">${tierLabel(t)}</span>`}

function tagHtml(tag){
  const map={hot:'🔥 极热',up:'↑ 上升',new:'★ 新增',flat:'— 平稳',none:'○ 未用'};
  return`<span class="ch-tag tag-${tag}">${map[tag]||tag}</span>`;
}

function sparkHtml(data){
  const mx=Math.max(...data,1);
  return data.map(v=>{
    const pct=Math.round((v/mx)*100);
    const col=pct>80?'#f87171':pct>60?'#fbbf24':'#4d8dff';
    return`<div class="spark-bar" style="height:${pct}%;background:${col}"></div>`;
  }).join('');
}

function cardHtml(b){
  const maxScore=Math.max(...b.channels.map(c=>c.score));
  const chRows=b.channels.map(c=>{
    const pct=Math.round((c.score/100)*100);
    return`
    <div class="ch-row" data-ch="${c.name}">
      <span class="ch-icon">${c.icon}</span>
      <span class="ch-name">${c.name}</span>
      <div class="ch-bar-wrap"><div class="ch-bar" style="width:${pct}%;background:${c.bar_color}"></div></div>
      <span class="ch-val">${c.score}</span>
      ${tagHtml(c.tag)}
    </div>`;
  }).join('');

  const latest=b.channels.find(c=>c.latest);
  const latestHtml=latest?`
  <div class="latest">
    <div class="latest-label">最新动态</div>
    <div class="latest-text">${latest.latest.text}</div>
    <div class="latest-meta">
      <span>${latest.icon} ${latest.name}</span>
      <span>${latest.latest.time}</span>
      <span>互动 ${latest.latest.eng}</span>
    </div>
  </div>`:'';

  return`
  <div class="card" data-id="${b.id}" data-tier="${b.tier}" data-heat="${b.heat}" data-alert="${b.alert}">
    <div class="card-head">
      <div class="co-logo">${b.emoji}</div>
      <div class="co-info">
        <div class="co-name">${b.name}</div>
        <div class="co-meta">
          ${tierBadge(b.tier)}
          ${b.alert?'<span class="badge" style="background:rgba(248,113,113,.15);color:var(--hot);border-color:rgba(248,113,113,.25)">⚡ 预警</span>':''}
          <span style="color:var(--dim)">${b.meta.hq}</span>
        </div>
      </div>
      <div class="heat-dot ${heatClass(b.heat)}"></div>
    </div>
    <div class="spark-wrap">
      <div class="spark-label">7日热度趋势</div>
      <div class="spark">${sparkHtml(b.sparkData)}</div>
    </div>
    <div class="channels">${chRows}</div>
    ${latestHtml}
  </div>`;
}

/* ═══ FILTER & SORT ═══ */
let currentFilter='all', currentSort='heat', currentSearch='', isListView=false;

function getFiltered(){
  let list=[...BROKERS];
  if(currentFilter==='tier1') list=list.filter(b=>b.tier==='tier1');
  else if(currentFilter==='tier2') list=list.filter(b=>b.tier==='tier2');
  else if(currentFilter==='hot') list=list.filter(b=>b.heat>=4);
  else if(currentFilter==='alert') list=list.filter(b=>b.alert);
  if(currentSearch) list=list.filter(b=>b.name.toLowerCase().includes(currentSearch.toLowerCase()));
  if(currentSort==='heat') list.sort((a,b)=>b.heat-a.heat);
  else if(currentSort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else if(currentSort==='posts') list.sort((a,b)=>{
    const ta=a.channels.reduce((s,c)=>s+c.posts,0);
    const tb=b.channels.reduce((s,c)=>s+c.posts,0);
    return tb-ta;
  });
  else if(currentSort==='tier') list.sort((a,b)=>{
    const m={tier1:0,tier2:1,tier3:2};
    return (m[a.tier]||9)-(m[b.tier]||9) || b.heat-a.heat;
  });
  return list;
}

function render(){
  const list=getFiltered();
  const grid=document.getElementById('brokerGrid');
  grid.innerHTML=list.map(cardHtml).join('');
  document.getElementById('countBadge').textContent=`${list.length} 家`;
  if(isListView) grid.classList.add('list-view'); else grid.classList.remove('list-view');
  // attach card click
  grid.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click',()=>openModal(el.dataset.id));
  });
}

/* ═══ MODAL ═══ */
function openModal(id){
  const b=BROKERS.find(x=>x.id===id); if(!b) return;
  document.getElementById('modalTitle').textContent=`${b.emoji} ${b.name}`;
  document.getElementById('modalSub').textContent=`${tierLabel(b.tier)} · ${b.meta.hq} · 成立 ${b.meta.founded}`;

  const totalPosts=b.channels.reduce((s,c)=>s+c.posts,0);
  const avgScore=Math.round(b.channels.reduce((s,c)=>s+c.score,0)/b.channels.length);
  const topCh=b.channels.reduce((a,c)=>c.score>a.score?c:a,b.channels[0]);

  const detailGrid=`
  <div class="detail-grid">
    <div class="detail-item"><div class="label">综合热度评分</div><div class="val ${b.heat>=4?'hot':b.heat>=3?'gold':''}">${avgScore}/100</div></div>
    <div class="detail-item"><div class="label">今日总发帖</div><div class="val blue">${totalPosts} 条</div></div>
    <div class="detail-item"><div class="label">最强渠道</div><div class="val">${topCh.icon} ${topCh.name}</div></div>
    <div class="detail-item"><div class="label">AUM / 规模</div><div class="val good">${b.meta.aum}</div></div>
    <div class="detail-item"><div class="label">用户规模</div><div class="val">${b.meta.users}</div></div>
    <div class="detail-item"><div class="label">预警状态</div><div class="val ${b.alert?'hot':'good'}">${b.alert?'⚡ 需关注':'✓ 正常'}</div></div>
  </div>`;

  const postList=b.channels.filter(c=>c.latest).map(c=>`
  <div class="post-item ${c.tag==='hot'?'viral':''}">
    <div class="post-title">${c.icon} [${c.name}] ${c.latest.text}</div>
    <div class="post-stats">
      <span>${c.latest.time}</span>
      <span class="${c.tag==='hot'?'hot-stat':''}">互动 ${c.latest.eng}</span>
    </div>
  </div>`).join('');

  document.getElementById('modalBody').innerHTML=`
  <div class="modal-section">
    <h3>核心指标</h3>${detailGrid}
  </div>
  <div class="modal-section">
    <h3>各渠道最新内容</h3>
    <div class="post-list">${postList}</div>
  </div>`;

  document.getElementById('modalBg').classList.add('open');
}

/* ═══ INIT ═══ */
document.addEventListener('DOMContentLoaded',()=>{
  render();

  // filter
  document.getElementById('filterBar').addEventListener('click',e=>{
    const btn=e.target.closest('.filter-btn'); if(!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.filter;
    render();
  });

  // search
  document.getElementById('searchInput').addEventListener('input',e=>{
    currentSearch=e.target.value; render();
  });

  // sort
  document.getElementById('sortSelect').addEventListener('change',e=>{
    currentSort=e.target.value; render();
  });

  // view toggle
  document.getElementById('gridViewBtn').addEventListener('click',()=>{
    isListView=false;
    document.getElementById('gridViewBtn').classList.add('active');
    document.getElementById('listViewBtn').classList.remove('active');
    render();
  });
  document.getElementById('listViewBtn').addEventListener('click',()=>{
    isListView=true;
    document.getElementById('listViewBtn').classList.add('active');
    document.getElementById('gridViewBtn').classList.remove('active');
    render();
  });

  // modal close
  document.getElementById('modalClose').addEventListener('click',()=>{
    document.getElementById('modalBg').classList.remove('open');
  });
  document.getElementById('modalBg').addEventListener('click',e=>{
    if(e.target===document.getElementById('modalBg'))
      document.getElementById('modalBg').classList.remove('open');
  });

  // stats
  document.getElementById('totalBrokers').textContent=BROKERS.length;
  document.getElementById('activeSources').textContent=
    BROKERS.reduce((s,b)=>s+b.channels.length,0);
  document.getElementById('todayPosts').textContent=
    BROKERS.reduce((s,b)=>s+b.channels.reduce((ss,c)=>ss+c.posts,0),0);
  document.getElementById('topBroker').textContent=
    BROKERS.reduce((a,b)=>b.heat>a.heat?b:a,BROKERS[0]).name;
  document.getElementById('alertCount').textContent=
    BROKERS.filter(b=>b.alert).length;
});
