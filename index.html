<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>券商竞品宣发监控 · BIT</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#16181c; --sub:#5b6470; --line:#e6e8eb;
    --accent:#3b5bdb; --good:#1f9d6b; --warn:#d97706; --hot:#e03131;
    --chip:#eef1f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:28px 20px 80px}
  .wrap{max-width:1180px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:6px}
  h1{font-size:24px;letter-spacing:-.3px}
  h1 small{font-size:13px;color:var(--sub);font-weight:400;margin-left:8px}
  .meta{font-size:12px;color:var(--sub);text-align:right}
  .meta b{color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:32px 0 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);border-radius:2px}

  /* highlights */
  .hl{background:linear-gradient(180deg,#fff, #fafbfd);border:1px solid var(--line);border-left:3px solid var(--hot);border-radius:12px;padding:16px 18px;margin-bottom:6px}
  .hl ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .hl li{font-size:14px;display:flex;gap:10px;align-items:flex-start}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
  .t-new{background:#ffe3e3;color:#c92a2a}.t-up{background:#fff3bf;color:#a07b00}.t-info{background:#e7f5ff;color:#1864ab}

  /* competitor grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .card-h{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0}
  .card-h .nm{font-size:16px;font-weight:700}
  .card-h .st{font-size:12px;color:var(--sub)}
  .status-pill{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .live{background:#d3f9d8;color:#2b8a3e}.soon{background:#fff3bf;color:#a07b00}.watch{background:var(--chip);color:var(--sub)}
  .blk{font-size:13px}
  .blk .lbl{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
  .blk ul{list-style:none;display:flex;flex-direction:column;gap:5px}
  .blk li{padding-left:14px;position:relative;color:#2b2f36}
  .blk li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:#c4c9d1}
  .align{background:#f1f8f4;border:1px solid #d7ece0;border-radius:9px;padding:10px 12px}
  .align .lbl{color:var(--good)}
  .x-sig{background:#f7f9fc;border:1px dashed #cfd6e0;border-radius:9px;padding:10px 12px}
  .x-sig .lbl{color:var(--accent)}
  .pending{color:#9aa2ad;font-style:italic}

  /* matrix */
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#fafbfc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--sub);font-weight:700}
  td:first-child{font-weight:600}
  .yes{color:var(--good);font-weight:700}.no{color:#cdd2da}
  tr:last-child td{border-bottom:none}

  /* actions */
  .actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .act{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:3px solid var(--accent)}
  .act h4{font-size:14px;margin-bottom:6px}
  .act p{font-size:13px;color:var(--sub)}
  .act .src{font-size:11px;color:#aab1bb;margin-top:8px}
  footer{margin-top:36px;font-size:11px;color:#aab1bb;text-align:center;line-height:1.8}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

</html>
