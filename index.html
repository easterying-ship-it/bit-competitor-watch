// ===== RENDER =====
const $=s=>document.querySelector(s);
const itemText=it=>typeof it==='string'?it:it.t;
const itemSrc =it=>typeof it==='string'?null:it.src;
const lnk=u=>u?` <a class="src-lnk" href="${u}" target="_blank" rel="noopener">↗ 源</a>`:'';
$("#range").textContent=DATA.range; $("#updated").textContent=DATA.updated; $("#next").textContent=DATA.next;

const tagLabel={'t-new':'NEW','t-up':'趋势','t-info':'待核实'};
const sigGroups=[
  {key:'main', cls:'grp-main', title:'主要竞争者动态', sub:'Bitget · Binance'},
  {key:'other', cls:'grp-other', title:'其他竞争者 / 行业', sub:'OKX · Gate · Bybit · HTX · Kraken · Coinbase'}
];
const hlItem=h=>`<li>${h.date?`<span class="hl-date">${h.date}</span>`:''}<span class="tag ${h.tag}">${tagLabel[h.tag]||''}</span><span>${h.txt}${lnk(h.src)}</span></li>`;
$("#signals").innerHTML=sigGroups.map(g=>{
  const items=DATA.highlights.filter(h=>(h.grp||'other')===g.key);
  if(!items.length) return '';
  return `<div class="hl-grp ${g.cls}"><div class="hl-gt">${g.title}<span>${g.sub}</span></div><div class="hl"><ul>${items.map(hlItem).join('')}</ul></div></div>`;
}).join('');

const stMap={live:'live-s',soon:'soon-s',watch:'watch-s'};
const liList=arr=>arr.map(it=>`<li class="${/待抓取|待本期/.test(itemText(it))?'pending':''}">${itemText(it)}${lnk(itemSrc(it))}</li>`).join("");
$("#grid").innerHTML=DATA.competitors.map(c=>`
  <div class="card ${c.tier===1?'tier1':''}">
    <div class="card-h">
      <div class="logo" style="background:${c.color};color:${c.ink}">${c.nm[0]}</div>
      <div><div class="nm">${c.nm}${c.tier===1?'<span class="primary-badge">主要竞品</span>':''}</div><div class="st">${c.sub}</div></div>
      <span class="status-pill ${stMap[c.status]||'watch-s'}">${c.statusTxt}</span>
    </div>
    <div class="blk"><div class="lbl">宣发手段</div><ul>${liList(c.promo)}</ul></div>
    <div class="blk"><div class="lbl">在跑活动</div><ul>${liList(c.activities)}</ul></div>
    <div class="x-sig"><div class="lbl">X 信号</div><div>${c.xsig}</div></div>
    ${c.sources&&c.sources.length?`<div class="srcs">${c.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">↗ ${s.label}</a>`).join("")}</div>`:''}
  </div>`).join("");

const cols=[["bitget","Bitget"],["binance","Binance"],["okx","OKX"],["gate","Gate"],["bybit","Bybit"],["htx","HTX"],["kraken","Kraken"],["coinbase","Coinbase"]];
const cell=v=>v===1?'<span class="yes">●</span>':v===0?'<span class="no">○</span>':'<span class="qq">?</span>';
$("#matrix").innerHTML=`<table><thead><tr><th>宣发手段</th>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead>
  <tbody>${DATA.techniques.map(t=>`<tr><td>${t.name}</td>${cols.map(c=>`<td>${cell(t[c[0]])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
